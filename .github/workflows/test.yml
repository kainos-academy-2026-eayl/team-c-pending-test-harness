name: Test Harness

on:
    workflow_dispatch:
    pull_request:
    push:

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22
            - name: Install dependencies
              run: npm ci
            - name: Clone frontend
              run: git clone --depth=1 https://github.com/kainos-academy-2026-eayl/team-c-pending-frontend.git
            - name: Clone backend
              run: git clone --depth=1 https://github.com/kainos-academy-2026-eayl/team-c-pending-backend.git
            - run: echo "BACKEND_PATH=./team-c-pending-backend" >> .env
            - run: echo "FRONTEND_PATH=./team-c-pending-frontend" >> .env
            - run: echo "BASE_URL=http://localhost:3001" >> .env
            - name: Setup and run tests
              run: ./test.sh
