name: Test Harness

on:
    workflow_dispatch:
    pull_request:
    push:
        branches:
            - main

jobs:
    test:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        env:
            ISTEST: "1"
            BACKEND_PATH: ./team-c-pending-backend
            FRONTEND_PATH: ./team-c-pending-frontend
            BASE_URL: http://0.0.0.0:3001
        steps:
            - uses: actions/checkout@v7
            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22
            - name: Install dependencies
              run: npm ci
            - name: Clone matching frontend and backend branches
              env:
                  SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
              run: |
                  for repository in team-c-pending-frontend team-c-pending-backend; do
                      url="https://github.com/kainos-academy-2026-eayl/$repository.git"
                      matching_ref=$(git ls-remote --heads "$url" "refs/heads/$SOURCE_BRANCH")
                      if [ -n "$matching_ref" ]; then
                          echo "Cloning $repository branch: $SOURCE_BRANCH"
                          git clone --depth=1 --branch "$SOURCE_BRANCH" "$url"
                      else
                          echo "No branch '$SOURCE_BRANCH' in $repository; using its default branch"
                          git clone --depth=1 "$url"
                      fi
                  done
            - name: Configure application environments
              run: |
                  # Local development values only; never use these in production.
                  cat > "$BACKEND_PATH/.env" <<'EOF'
                  PORT=3000
                  POSTGRES_USER=dev
                  POSTGRES_PASSWORD=dev
                  POSTGRES_DB=app_dev
                  POSTGRES_PORT=5432
                  DATABASE_URL=postgresql://dev:dev@localhost:5432/app_dev
                  JWT_SECRET=asjdoiais9pioi3h1kjwj3l
                  EOF
                  cat > "$FRONTEND_PATH/.env" <<'EOF'
                  API_ADDRESS=http://localhost:3000
                  PORT=3001
                  EOF
            - name: Start database
              run: docker compose up -d --wait
            - name: Install backend dependencies and prepare database
              working-directory: ./team-c-pending-backend
              run: |
                  npm ci
                  npx prisma generate
                  npx prisma db push --force-reset
                  npx prisma db seed
            - name: Install frontend dependencies
              working-directory: ./team-c-pending-frontend
              run: npm ci
            - name: Install Playwright browser
              run: npx playwright install --with-deps chromium
            - name: Start backend
              working-directory: ./team-c-pending-backend
              run: |
                  npm run dev > "$GITHUB_WORKSPACE/backend.log" 2>&1 &
                  curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 1 --retry-max-time 60 --max-time 5 http://localhost:3000/health
            - name: Start frontend
              working-directory: ./team-c-pending-frontend
              run: |
                  npm run dev > "$GITHUB_WORKSPACE/frontend.log" 2>&1 &
                  curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 1 --retry-max-time 60 --max-time 5 http://localhost:3001/health
            - name: Run tests
              run: npx playwright test --workers=1
            - name: Show application and database logs on failure
              if: failure()
              run: |
                  for log in backend.log frontend.log; do
                      if [ -f "$log" ]; then
                          echo "=== $log ==="
                          cat "$log"
                      fi
                  done
                  docker compose logs
            - name: Stop database
              if: always()
              run: docker compose down --volumes
